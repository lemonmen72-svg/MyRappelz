# Сборка APK и публикация релиза. Запускается ТОЛЬКО вручную (по команде Максима):
# Actions → «Сборка APK» → Run workflow, пуш тега вида v0.1.0
# или изменение версии в android/release_version.txt (так собирает Claude по команде).
name: Сборка APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (например 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    # Ветки: только когда меняется android/release_version.txt (paths). Теги v*: всегда.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "android/release_version.txt"

permissions:
  contents: write
  # Время шагов задачи из API (шаг «Время этапов», .github/scripts/step_times.py)
  actions: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.3"
      # Фоновая загрузка пакета ресурсов (Android DownloadManager, ход загрузки — в уведомлении): плагин Godot v2
      # android/plugins/myrappelz_download, APK собирается Gradle. "0" — APK как раньше (без Gradle; пакет качается
      # внутри игры через HTTPRequest). Не вышла Gradle-сборка — сборка не падает, APK собирается по-старому.
      BACKGROUND_DOWNLOAD: "1"
      RAW_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        run: |
          V="${RAW_VERSION:-$(tr -d '[:space:]' < android/release_version.txt)}"
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"

      # Пакет ресурсов разбит на части (Assets.PACKS: герои по расам, жители, звери). Версия каждой части = хэш её
      # содержимого (исходники моделей части, их .import, версия Godot) — строки «часть хэш» в asset_parts.txt.
      # Считается до импорта Godot: импорт переписывает .import. Часть не изменилась — игра берёт её из кэша.
      - name: Хэш пакета ресурсов
        run: |
          set -euo pipefail
          python3 -I tools/asset_pack.py check
          python3 -I tools/asset_pack.py files --summary
          python3 -I tools/asset_pack.py digest --godot "$GODOT_VERSION" | tee "$RUNNER_TEMP/asset_parts.txt"
          test -s "$RUNNER_TEMP/asset_parts.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Установка Godot и шаблонов Android
        run: .github/scripts/setup_godot.sh android

      # ---------- Кэш импорта Godot: после «Хэш пакета ресурсов» (хэш считается до импорта). Свой ключ сборки APK,
      # запасной — кэш «Проверки кода» (настройки сжатия текстур те же; устаревшее отсекает import_cache.py) ----------
      - name: Ключ кэша импорта
        id: ikey
        run: .github/scripts/import_key.sh godot-import-apk

      - name: Кэш импорта Godot
        id: import-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .godot/imported
            .godot/ci_import_state.json
            .godot/ci_import_files
          key: ${{ steps.ikey.outputs.key }}
          restore-keys: |
            ${{ steps.ikey.outputs.restore }}
            godot-import-v1-${{ env.GODOT_VERSION }}-

      - name: Импорт проекта
        run: .github/scripts/import.sh

      - name: Сохранение кэша импорта
        if: steps.import-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .godot/imported
            .godot/ci_import_state.json
            .godot/ci_import_files
          key: ${{ steps.ikey.outputs.key }}

      # ---------- Автотест в фоне, пока идёт сборка: на копии проекта (сборка дальше меняет project.godot,
      # export_presets.cfg, кладёт assets_pack.json), 2 потока со своими user://. Результат ждёт шаг
      # «Результат автотеста» перед публикацией релиза: тест не прошёл — релиза нет. ----------
      - name: Автотест (в фоне)
        run: |
          set -euo pipefail
          . .github/scripts/timing.sh
          t0=$(date +%s)
          T="$RUNNER_TEMP/test-tree"
          rm -rf "$T"
          mkdir -p "$T"
          shopt -s dotglob nullglob
          for e in *; do
            case "$e" in .git|build) continue ;; esac
            cp -a "$e" "$T/"
          done
          t_done "копия проекта для автотеста" "$t0"
          cd "$T"
          rm -f "$RUNNER_TEMP/smoke.code"
          nohup setsid bash -c 'SMOKE_JOBS=2 .github/scripts/smoke_test.sh > "$RUNNER_TEMP/smoke.log" 2>&1; echo $? > "$RUNNER_TEMP/smoke.code"' \
            > /dev/null 2>&1 &
          echo "автотест запущен в фоне: $T"

      - name: Настройка Android SDK и подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "$SDK/build-tools" "$SDK/platform-tools"

          # Свой ключ из секретов, иначе ключ разработчика из репозитория
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            KS_USER="$KEYSTORE_USER"
            KS_PASS="$KEYSTORE_PASS"
          else
            cp android/dev.keystore "$KS"
            KS_USER="myrappelz"
            KS_PASS="myrappelz-dev"
          fi

          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION}.tres"; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "$KS_USER"
          export/android/debug_keystore_pass = "$KS_PASS"
          EOF
          done

          sed -i \
            -e "s|^keystore/release=.*|keystore/release=\"$KS\"|" \
            -e "s|^keystore/release_user=.*|keystore/release_user=\"$KS_USER\"|" \
            -e "s|^keystore/release_password=.*|keystore/release_password=\"$KS_PASS\"|" \
            -e "s|^version/code=.*|version/code=${{ github.run_number }}|" \
            -e "s|^version/name=.*|version/name=\"$VERSION\"|" \
            export_presets.cfg

          # Версия игры в настройках проекта (Assets.game_version — адрес манифеста в релизе)
          sed -i '/^config\/version=/d' project.godot
          sed -i "s|^config/name=.*|&\nconfig/version=\"$VERSION\"|" project.godot
          grep -n "^config/" project.godot

      # Пакет ресурсов по частям (пресеты «Assets <часть>»): тяжёлые модели, которых нет в APK. Экспортируется до APK,
      # чтобы манифест (части: хэш, sha256, размер, адрес) лёг в APK как res://assets_pack.json.
      - name: Экспорт пакета ресурсов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Часть не менялась (тот же хэш) — берём сам её файл из последнего релиза, где он есть: экспорт Godot
          # побайтно не повторяется (другие sha256 и размер), и игра скачала бы часть заново. Файл загружается и в
          # новый релиз (у каждого релиза полный комплект, адреса манифеста — на свой релиз; старые можно удалять).
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" > "$RUNNER_TEMP/releases.json" \
            || echo "[]" > "$RUNNER_TEMP/releases.json"
          MANIFEST_ARGS=()
          EXPORTED=0
          REUSED=0
          mapfile -t PARTS < "$RUNNER_TEMP/asset_parts.txt"
          for LINE in "${PARTS[@]}"; do
            NAME="${LINE%% *}"
            HASH="${LINE##* }"
            PCK="build/MyRappelz-assets-$NAME-${HASH:0:16}.pck"
            URL=$(python3 -I -c "import json,sys; d=json.load(open(sys.argv[1])); n=sys.argv[2]; print(next((a['browser_download_url'] for r in (d if isinstance(d, list) else []) for a in r.get('assets', []) if a.get('name') == n), ''))" \
              "$RUNNER_TEMP/releases.json" "$(basename "$PCK")" || true)
            if [ -n "$URL" ] && curl -sfL -o "$PCK" "$URL" && test -s "$PCK" \
                && python3 -I tools/asset_pack.py verify-pck --part "$NAME" "$PCK"; then
              echo "Часть $NAME не изменилась — взята из прошлого релиза: $URL"
              REUSED=$((REUSED + 1))
            else
              rm -f "$PCK"
              echo "Часть $NAME: экспорт"
              timeout 600 godot --headless --path . --export-pack "Assets $NAME" "$PCK" < /dev/null 2>&1 \
                | tee -a export_pack.log || true
              test -s "$PCK" || { echo "::error::часть пакета $NAME не экспортирована"; exit 1; }
              python3 -I tools/asset_pack.py verify-pck --part "$NAME" "$PCK"
              EXPORTED=$((EXPORTED + 1))
            fi
            MANIFEST_ARGS+=(--part "$NAME" "$PCK" "$HASH")
          done
          echo "Части пакета ресурсов: экспортировано $EXPORTED, взято из прошлых релизов $REUSED"
          ls -la build
          python3 -I tools/asset_pack.py manifest --version "$VERSION" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            --out build/assets-manifest.json "${MANIFEST_ARGS[@]}"
          cp build/assets-manifest.json assets_pack.json

      # ---------- Кэш Android SDK (NDK r23c для Gradle-сборки), Gradle и AAR плагина фоновой загрузки ----------
      - name: Путь Android SDK
        if: env.BACKGROUND_DOWNLOAD == '1'
        run: echo "SDK_DIR=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Кэш NDK
        if: env.BACKGROUND_DOWNLOAD == '1'
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}/ndk/23.2.8568313
          key: android-ndk-23.2.8568313-${{ runner.os }}

      - name: Кэш Gradle
        if: env.BACKGROUND_DOWNLOAD == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-godot${{ env.GODOT_VERSION }}-${{ hashFiles('android/plugins/**/*.gradle', 'android/plugins/**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-godot${{ env.GODOT_VERSION }}-

      # Собранный AAR плагина: есть в кэше (те же исходники плагина и версия Godot) — Gradle-сборка AAR пропускается
      - name: Кэш AAR плагина
        if: env.BACKGROUND_DOWNLOAD == '1'
        uses: actions/cache@v4
        with:
          path: android/plugins/myrappelz_download/build/outputs/aar/myrappelz_download-release.aar
          key: myrappelz-download-aar-godot${{ env.GODOT_VERSION }}-${{ hashFiles('android/plugins/myrappelz_download/**') }}

      # Плагин фоновой загрузки: шаблон Gradle-сборки Godot в android/build (как «Проект → Установить шаблон сборки
      # Android»), AAR плагина → addons/myrappelz_download/bin (его подключает плагин редактора), Gradle-сборка у
      # пресета «Android» (пакет ресурсов уже экспортирован). Шаг не роняет сборку: без GRADLE_BUILD=1 — обычный экспорт.
      - name: Плагин фоновой загрузки (Gradle)
        if: env.BACKGROUND_DOWNLOAD == '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="$SDK"
          # Что просит шаблон Godot 4.3 (config.gradle): платформа 34, build-tools 34.0.0, NDK r23c
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # Всё уже есть (образ раннера, кэш NDK) — sdkmanager не нужен
          NEED=0
          for d in platforms/android-34 build-tools/34.0.0 ndk/23.2.8568313; do
            [ -f "$SDK/$d/source.properties" ] || NEED=1
          done
          echo "пакеты SDK: $([ "$NEED" = 1 ] && echo "ставятся" || echo "уже есть")"
          if [ "$NEED" = 1 ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" > sdkmanager.log 2>&1 \
              || { tail -n 20 sdkmanager.log; echo "::warning::sdkmanager: не всё установлено"; }
          fi
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -f "$TPL/android_source.zip"
          rm -rf android/build
          mkdir -p android/build
          unzip -q -o "$TPL/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          chmod +x android/build/gradlew
          AAR=android/plugins/myrappelz_download/build/outputs/aar/myrappelz_download-release.aar
          if [ -s "$AAR" ]; then
            echo "AAR плагина — из кэша, Gradle-сборка AAR пропущена"
          else
          # Классы Godot для компиляции плагина — из godot-lib шаблона (та же версия, что в APK), иначе Maven Central
          EXTRA=()
          GODOT_AAR=$(ls android/build/libs/release/godot-lib*.aar 2>/dev/null | head -n 1 || true)
          if [ -n "$GODOT_AAR" ]; then
            mkdir -p "$RUNNER_TEMP/godot-lib"
            unzip -q -o "$GODOT_AAR" classes.jar -d "$RUNNER_TEMP/godot-lib"
            EXTRA=(-Pgodot_lib_jar="$RUNNER_TEMP/godot-lib/classes.jar")
          fi
          android/build/gradlew --no-daemon -p android/plugins/myrappelz_download assembleRelease "${EXTRA[@]}"
          fi
          test -s "$AAR"
          mkdir -p addons/myrappelz_download/bin
          cp "$AAR" addons/myrappelz_download/bin/
          ls -la addons/myrappelz_download/bin
          sed -i '/^\[preset\.0\.options\]/,/^\[preset\.1\]/ s|^gradle_build/use_gradle_build=.*|gradle_build/use_gradle_build=true|' export_presets.cfg
          grep -n "use_gradle_build" export_presets.cfg
          echo "GRADLE_BUILD=1" >> "$GITHUB_ENV"

      - name: Экспорт APK
        run: |
          set -uo pipefail
          mkdir -p build
          APK="build/MyRappelz-$VERSION.apk"
          GRADLE="${GRADLE_BUILD:-0}"
          if [ "$GRADLE" = "1" ]; then
            # Gradle-сборка с плагином фоновой загрузки (первый раз Gradle качает зависимости — дольше)
            timeout 1800 godot --headless --path . --export-release "Android" "$APK" 2>&1 | tee export.log
            if [ ! -s "$APK" ]; then
              echo "::warning::Gradle-сборка APK не удалась — APK без фоновой загрузки (пакет качается внутри игры)"
              GRADLE=0
              echo "GRADLE_BUILD=0" >> "$GITHUB_ENV"
              sed -i '/^\[preset\.0\.options\]/,/^\[preset\.1\]/ s|^gradle_build/use_gradle_build=.*|gradle_build/use_gradle_build=false|' export_presets.cfg
              rm -f addons/myrappelz_download/bin/*.aar
              timeout 600 godot --headless --path . --export-release "Android" "$APK" 2>&1 | tee -a export.log
            fi
          else
            timeout 600 godot --headless --path . --export-release "Android" "$APK" 2>&1 | tee export.log
          fi
          ls -la build
          test -s "$APK" || exit 1
          if [ "$GRADLE" = "1" ]; then
            if unzip -p "$APK" 'classes*.dex' | grep -aq "com/lemonmen/myrappelz/download/DownloadPlugin"; then
              echo "APK: плагин фоновой загрузки на месте (Gradle-сборка)"
            else
              echo "::warning::в APK нет класса плагина фоновой загрузки — пакет будет качаться внутри игры"
            fi
          fi
          # Модели пакета не должны попасть в APK, запасные модели и манифест — должны
          # (проверка по списку файлов APK; если Godot сложил их в один .pck внутри APK — пропускается)
          unzip -l "$APK" > apk_files.txt || true
          if grep -q "project.binary" apk_files.txt; then
            if grep -E "hero_wizard_f\.(glb|png)|wolf_2\.(glb|png)" apk_files.txt; then
              echo "::error::в APK попали файлы пакета ресурсов"; exit 1
            fi
            grep -q "hero_human_m_starter.glb" apk_files.txt || { echo "::error::в APK нет запасной модели героя"; exit 1; }
            grep -q "assets_pack.json" apk_files.txt || { echo "::error::в APK нет манифеста пакета"; exit 1; }
            echo "APK: файлов пакета нет, запасные модели и манифест на месте"
          else
            echo "::warning::список файлов APK не проверен"
          fi

      # ---------- Результат автотеста, запущенного в фоне («Автотест (в фоне)»): не прошёл — релиза нет ----------
      - name: Результат автотеста
        run: |
          . .github/scripts/timing.sh
          t0=$(date +%s)
          for i in $(seq 1 360); do
            [ -f "$RUNNER_TEMP/smoke.code" ] && break
            sleep 5
          done
          t_done "ожидание автотеста после сборки" "$t0"
          cat "$RUNNER_TEMP/smoke.log" 2>/dev/null || true
          code=$(cat "$RUNNER_TEMP/smoke.code" 2>/dev/null || echo 124)
          if [ "$code" != "0" ]; then
            echo "::error::автотест не прошёл (код $code) — релиз не публикуется"
            exit 1
          fi

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MyRappelz ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            build/MyRappelz-${{ env.VERSION }}.apk
            build/MyRappelz-assets-*.pck
            build/assets-manifest.json
          body: |
            Прототип MyRappelz ${{ env.VERSION }} для Android (сборка №${{ github.run_number }}, коммит ${{ github.sha }}).

            **Установка:** скачайте `MyRappelz-${{ env.VERSION }}.apk` на телефон, откройте его и разрешите установку из неизвестных источников.

            **Пакет ресурсов:** модели героев профессий, жителей и старших стадий питомцев — отдельными файлами по частям (`MyRappelz-assets-<часть>-….pck`: герои по расам, жители, звери; список — `assets-manifest.json`). Игра сама загрузит их при первом запуске (покажет размер и спросит) и сохранит в своей памяти; следующие версии скачивают только изменившиеся части. Вручную их скачивать не нужно. ${{ env.GRADLE_BUILD == '1' && 'Загрузка идёт в фоне средствами Android: игру можно свернуть, ход загрузки виден в уведомлении (на Android 13+ игра спросит разрешение на уведомления); можно и играть сразу на запасных моделях — пакет подключится при следующем входе в мир.' || '' }}

            **Новое в 0.23:** зелья 5 видов (здоровье, мана, скорость атаки, каста и бега) с рангами каждые 10 уровней; добыча — 2 предмета с обычного зверя, 3 с мини-босса, 4 с босса, золото всегда (мешочком); случайные предметы в наградах заданий; золото на складе; оружие 2-го ранга (13 моделей, с 21 ур.; на острове не продаётся). Обычные звери нейтральны (нападают, только если их задеть), боссы и «Редкие» звери нападают сами; на 1–9 уровне звери слабее — Бродяга побеждает своего зверя. Компактные панели (уровень в кружке, HP/MP/опыт внутри полосок), меню и кнопки — значками (подпись — удержанием), над жителями «!» (можно взять), «?» (взято), «=» (можно сдать), над зверями-целями задания — красная метка. Бег и шаг — с манекенов (без «прыжков»), трусца и быстрый бег, новые варианты ударов, отскок, блок, эмоции; герой больше не дёргается у стен и в бою, камера не трясётся на кочках.

            **Аккаунт и персонажи:** при запуске — вход по логину (аккаунт хранится на телефоне), до 4 персонажей на аккаунт, у каждого свой ник. Создание по шагам: раса (сильные и слабые стороны) → профессии расы → пол (модели Бродяг) → ник. Герой появляется в деревне своей расы. Сменить персонажа — «Настройки» → «Сменить персонажа / выйти из аккаунта». Админ-панель — только у логина Dedok_max.

            **Задания острова:** староста своей деревни (5 заданий новичка) → Мудрец Альдерик в городе (4 направления: 10 уровень, склад у кладовщика, покупки и продажи у торговца, знакомство с Учителем Кирком) → охотница Ярра в Западном лагере (охота на 20 волков, затем 7 заданий на вожаков-боссов, их можно проходить когда угодно) → доклад Мудрецу и выбор профессии (с 10 ур.) → первое умение → Корвен, глава наёмников у пещеры (подземелье — позже). У кладовщика Тобина работает склад (40 ячеек).

            **Графика:** «Настройки» → вкладка «Графика»: общий пресет (Низкое / Среднее / Высокое / Максимальное) и отдельные настройки — разрешение 3D, кадры в секунду, тени, сглаживание (FXAA, MSAA 2×/4×), дальность прорисовки, густота травы, текстуры, контуры, постобработка, эффекты, тени на персонажах. Тени мягкие, модели героев и зверей больше не покрываются пятнами собственной тени. Если игра тормозит — снизьте тени и сглаживание.

            **Питомец:** круглые кнопки под панелью питомца — «Авто» (сам нападает на ближайшего зверя рядом с героем), «Атака» (бьёт выделенную цель), «Защита» (бьёт тех, кто напал на героя или на него, и цель героя), «За мной» (не дерётся); выбранный режим запоминается. В окне существа (вкладка «Умения») — 3 ячейки «Авто» (эти умения питомец применяет сам, по порядку) и 2 ячейки «Ауры» (включённые узы и ауры).

            **Модели и движения:** жители острова — модели Максима со своими предметами (молот, посохи, трость, книги, лук и колчан, ключи); оружие 1-го ранга — модели Максима (лук — лук охотницы), двуручное оружие, лук и арбалет держатся двумя руками; на всех героях — 40 новых движений: атаки по виду оружия сериями, умения, урон, смерть, подбор. Копьё — новое оружие Мечника.

            **Время каста:** часть умений (в основном заклинания) применяется не мгновенно — у героя петля каста, под ним полоса каста; ходьба или потеря цели прерывают каст (MP не тратится), урон не сбивает. Посохи ускоряют каст.

            **Управление:** слева джойстик; справа «Атака» (держать), четыре кнопки умений (назначаются в окне героя),
            «Приручить» и «Зелье»; вверху меню «Герой», «Питомцы», «Сумка», «Задания», «Настройки».
            Рядом с торговцем — кнопка «Торговец», рядом с Учителем Кирком в центре города — «Говорить» (задания и лавка карт).
            **Приручение:** купите карту существа у Учителя Кирка в центре города (карты волка и кентавра выпадают с этих зверей), нажмите «Приручить» рядом со зверем этого вида и победите его; карту с душой сформируйте в существо («Сформировать» в сумке или в окне «Питомцы»).
            **Бой:** у монстров те же 7 статов, что у героя; с 10 уровня зверь равен герою своего уровня, а здоровья у зверей втрое больше — в одиночку без умений, питомца и зелий зверь своего уровня сильнее, боссы почти непобедимы (на 1–9 уровне звери слабее). Попадание, урон и пробивание защиты зависят от статов и разницы уровней. Монстры на острове до 30 уровня, 7 боссов, опыт зависит от разницы уровней. Оружие профессий с бонусами (вторая рука: щит или пара), лук. У всех профессий свои модели (мужчина и женщина).
            **Профессии:** герой любой расы и пола начинает Бродягой; с 10 уровня у Мудреца Альдерика — задание и выбор одной из трёх профессий своей расы (до 20 ур. — сверх-эволюция: +5 очков умений за уровень). Действуют все умения всех 9 профессий (искры духа Воина, лезвия стихий Шамана, щит и угроза Мечника, лечение Волшебника, зоны на земле Неофита, связь с питомцем у Зверолова, Адепта и Колдуна). Для теста (логин Dedok_max): «Настройки» → «Админ-панель» (раса, пол, профессия, уровень, очки умений, множитель опыта, предметы, питомцы, перенос).
            **Мир:** постройки, деревья, камни и овцы — модели Максима. **Интерфейс:** значки умений и предметов на кнопках, бафы и дебафы справа от полосок здоровья (время действия убывает по часовой стрелке).
            **Существа:** у питомцев три стадии эволюции со своими моделями; приручаются пантера, черепаха, фазан (базовые), волк (обычный), кентавр (редкий). Летающие рыбы и анатемы — только враги.

      # ---------- Gradle-демон не держит файлы кэша при сохранении; время шагов задачи ----------
      - name: Остановка Gradle
        if: always()
        run: pkill -f GradleDaemon || true

      - name: Время этапов
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/step_times.py
